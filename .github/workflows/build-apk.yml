name: Build Neura Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Neura APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Neura-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neura-v1.0.0-APK
          path: release-apk/Neura-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Neura AI Voice Assistant v1.0.0"
          body: |
            ### 🌟 Neura AI Voice Assistant for Android
            Download the attached `Neura-v1.0.0.apk` below and install it directly on your Android phone!
            
            **Features included:**
            - 🎙️ OpenAI GPT-4o Voice Assistant with Fluid Glowing Orb Visualizer
            - 📱 Direct phone calling, SMS drafting, and Dynamic App Launcher
            - ⏰ Alarms, Timers, and Calendar event creation
            - 🔦 Flashlight torch control & Media volume controls
            - 🌦️ Live weather forecasts & real-time device telemetry
            - ⚡ Background listening & Floating bubble overlay
          files: release-apk/Neura-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
